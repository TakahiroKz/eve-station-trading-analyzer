name: Deploy

# Solo dispara con push a main (o manualmente) -- nunca en push a otras ramas ni en
# pull_request, para que abrir/actualizar una PR jamás toque la VM de producción.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/takahirokz/eve-station-trading-analyzer

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            git pull --ff-only
            docker compose --profile cron pull
            docker compose up -d api
            docker image prune -f

            # El puerto 8001 ya no está expuesto públicamente (T14/D9) -- este check
            # corre DESDE la VM, contra localhost, en vez de desde el runner contra
            # la IP pública como antes.
            echo "Post-deploy health check..."
            for i in $(seq 1 10); do
              if curl -fsS --connect-timeout 5 --max-time 10 "http://localhost:8001/api/summary" > /dev/null; then
                echo "Health check OK (intento $i)"
                exit 0
              fi
              echo "Intento $i/10 falló, reintentando en 5s..."
              sleep 5
            done
            echo "La API no respondió después del deploy -- ver DEPLOYMENT_FAILED en CONTRIBUTING.md" >&2
            exit 1
