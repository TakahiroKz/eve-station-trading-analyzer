    <!-- Static content for crawlers (including AI ones) that do not run JavaScript. It lives in

    <noscript>
      <h1>EveMarket Screener — station trading in EVE Online</h1>
      <p>
        Free screener that ranks the items of The Forge (Jita) market by ROI, spread, daily
        volume and trades per day. Data is refreshed every 4 hours. Available in English,
        Spanish, German, French and Italian.
      </p>
      <h2>Frequently asked questions</h2>
      <h3>What is station trading?</h3>
      <p>
        Buying items at the buy-order price and reselling them with a sell order in the same
        station, earning the difference (spread) minus taxes and fees.
      </p>
      <h3>What do the categories mean?</h3>
      <p>
        Potential: spread, liquidity and real market activity over the last 7 days meet the
        criteria. No orders: spread and liquidity qualify, but the executed-trade history is
        too low (little volume or few trades per day). Under observation: borderline case,
        more history is needed. Discarded: losing spread or unviable liquidity.
      </p>
      <h3>Where does the data come from?</h3>
      <p>From the ESI, CCP Games' official API for EVE Online. No scraping is used.</p>
      <h3>How often is the data refreshed?</h3>
      <p>The market engine runs every 4 hours.</p>
      <h3>Is it free?</h3>
      <p>Yes, the Screener is public and requires no account.</p>
      <p>
        Independent site, not affiliated with CCP Games. EVE Online is a trademark of CCP hf.
        Informational tool, not investment advice.
      </p>
      <p>Enable JavaScript to use the interactive Screener.</p>
    </noscript>
