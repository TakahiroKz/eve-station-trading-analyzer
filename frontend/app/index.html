<!doctype html>
<html lang="%SEO_LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="%SEO_MANIFEST%" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090f" />
    <meta name="color-scheme" content="dark" />
    <!-- The %SEO_*% tokens and the two SEO_ comments are filled per language by the
         `language-pages` plugin in vite.config.ts (one HTML page per language: /, /es/, /de/,
         /fr/, /it/), using the same dictionaries as the app. -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="%SEO_CANONICAL%" />
    <!--SEO_HREFLANG-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EveMarket Screener" />
    <meta property="og:locale" content="%SEO_LOCALE%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_CANONICAL%" />
    <meta property="og:image" content="https://evemarket-analyzer.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EveMarket Screener: station trading screener for EVE Online" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://evemarket-analyzer.online/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "EveMarket Screener",
        "url": "https://evemarket-analyzer.online/",
        "description": "Free station trading screener for EVE Online: items with the best ROI, spread and liquidity in The Forge (Jita), refreshed every 4 hours.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": ["en", "es", "de", "fr", "it"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static content for crawlers (including AI ones) that do not run JavaScript. It lives in
         <noscript> on purpose: in a normal browser it is never rendered, so there is no flash
         of unstyled text before the app loads. ASSUMPTION, not verified: that crawlers read
         <noscript> content; Google renders JavaScript and sees the mounted app instead. -->
    <noscript>
      <!--SEO_NOSCRIPT-->
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
